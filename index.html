<!doctype html>

<head>

<meta name="application-name" content="STMISCH">
<meta name="apple-mobile-web-app-title" content="STMISCH">

<meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.shell{height:100dvh;display:flex;flex-direction:column}.bar{height:54px;flex:0 0 54px;background:#111827;color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px}.bar img{width:34px;height:34px;object-fit:contain;border-radius:7px;background:#fff}.bar-title{font-size:15px;font-weight:800;line-height:1.15;flex:1}.bar-sub{font-size:10px;opacity:.72;font-weight:400;margin-top:2px}.bar button{border:0;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer}.open{background:#fff;color:#111827}.frame-wrap{position:relative;flex:1;min-height:0}.frame{display:block;width:100%;height:100%;border:0;background:#f3f5f8}.fallback{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;padding:20px;background:#f3f5f8}.card{width:min(560px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}.logo{width:76px;height:76px;object-fit:contain;margin:0 auto 12px}.card h1{font-size:21px;margin:0 0 8px}.card p{font-size:14px;line-height:1.6;color:#4b5563;margin:0 0 18px}.primary{display:inline-block;background:#111827;color:#fff;text-decoration:none;border:0;border-radius:10px;padding:13px 20px;font-weight:800;cursor:pointer}.small{font-size:12px!important;color:#6b7280!important;margin-top:14px!important}.hidden{display:none!important}@media(max-width:600px){.bar{height:50px;flex-basis:50px}.bar img{width:30px;height:30px}.bar-title{font-size:13px}.bar-sub{font-size:9px}.open{padding:7px 9px}}
</style>
</head>
<body>
<div class="shell">
<header class="bar">
<img src="./icon-180.png?v=66" alt="SCH">
<div class="bar-title">STMISCH<div class="bar-sub">Sistem Tempahan Majlis Ijazah Silat Cekak Hanafi</div></div>
<button class="open" id="openBtn" type="button">BUKA</button>
</header>
<main class="frame-wrap">
<iframe class="frame" id="appFrame" title="STMISCH" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
<div class="fallback" id="fallback">
<div class="card">
<img class="logo" src="./icon-180.png?v=66" alt="Logo Silat Cekak Hanafi">
<h1>STMISCH</h1>
<p>Sistem Tempahan Majlis Ijazah Silat Cekak Hanafi</p>
<button class="primary" id="fallbackBtn" type="button">BUKA STMISCH</button>
<p class="small">Jika paparan dalam GitHub tidak dimuatkan, butang ini membuka Web App rasmi secara terus.</p>
</div>
</div>
</main>
</div>
<script>
(function(){
const APP_URL='https://script.google.com/macros/s/AKfycbynkJ3HiGgcimpxa0klmeTpcWjD4doMnrWxlcBHxQTj6lhNqYaPiwUQpl-YmCPS11ucVg/exec';
const frame=document.getElementById('appFrame');
const fallback=document.getElementById('fallback');
const openBtn=document.getElementById('openBtn');
const fallbackBtn=document.getElementById('fallbackBtn');
function openDirect(){window.location.href=APP_URL;}
openBtn.addEventListener('click',openDirect);
fallbackBtn.addEventListener('click',openDirect);
frame.src=APP_URL;
// Cross-origin iframe content cannot be inspected reliably. Show a direct-open fallback after a short wait.
setTimeout(function(){fallback.style.display='flex';},7000);
frame.addEventListener('load',function(){fallback.style.display='none';});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=66').catch(()=>{}));}
})();
</script>
</body>
