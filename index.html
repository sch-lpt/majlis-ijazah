<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Aplikasi Tempahan Majlis Ijazah Silat Cekak Hanafi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tempahan Ijazah SCH">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Tempahan Majlis Ijazah SCH</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f5f8;color:#111827}
    body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    .shell{height:100dvh;display:flex;flex-direction:column}
    .bar{height:54px;flex:0 0 54px;background:#111827;color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px}
    .bar img{width:34px;height:34px;object-fit:contain;border-radius:7px;background:#fff}
    .bar-title{font-size:14px;font-weight:700;line-height:1.15;flex:1}
    .bar-sub{font-size:10px;opacity:.72;font-weight:400;margin-top:2px}
    button{border:0;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer}
    .settings{background:#fff;color:#111827}
    .open{background:#e5e7eb;color:#111827;margin-right:4px}
    iframe{border:0;width:100%;height:100%;background:#f3f5f8;display:block}
    .frame-wrap{position:relative;flex:1;min-height:0}
    .setup{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#f3f5f8,#eef1f5)}
    .setup-card{width:min(620px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .setup-logo{display:block;width:78px;height:78px;object-fit:contain;margin:0 auto 12px}
    h1{font-size:21px;text-align:center;margin:0 0 6px}
    .red{color:#e53935}
    .desc{font-size:13px;line-height:1.6;color:#4b5563;text-align:center;margin:0 0 18px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;outline:0}
    input:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
    .primary{width:100%;margin-top:12px;background:#111827;color:#fff;padding:13px}
    .help{font-size:12px;color:#6b7280;line-height:1.6;margin:14px 0 0}
    .help b{color:#111827}
    .hidden{display:none!important}
    @media(max-width:600px){.bar{height:50px;flex-basis:50px}.bar img{width:30px;height:30px}.bar-title{font-size:12px}.bar-sub{font-size:9px}.open{display:none}.setup-card{padding:20px}.setup-logo{width:68px;height:68px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <img src="icons/icon-192.png" alt="SCH">
    <div class="bar-title">Tempahan Majlis Ijazah <span class="red">Silat Cekak Hanafi</span><div class="bar-sub">Aplikasi SCH</div></div>
    <button class="open" id="openBtn" type="button">Buka</button>
    <button class="settings" id="settingsBtn" type="button">⚙</button>
  </header>
  <main class="frame-wrap">
    <div class="setup" id="setup">
      <div class="setup-card">
        <img class="setup-logo" src="icons/icon-192.png" alt="Logo Silat Cekak Hanafi">
        <h1>Tempahan Majlis Ijazah <span class="red">Silat Cekak Hanafi</span></h1>
        <p class="desc">Aplikasi telah dikonfigurasikan. Tekan <b>BUKA APLIKASI</b> untuk terus menggunakan sistem.</p>
        <label for="appUrl">URL Web App</label>
        <input id="appUrl" type="url" inputmode="url" autocomplete="url" value="https://script.google.com/macros/s/AKfycbynkJ3HiGgcimpxa0klmeTpcwJd4doMnrWxlcBHxQTj6lhNqYaPiwUQpl-YmCPS11ucVg/exec" readonly class="hidden">
        <button class="primary" id="saveBtn" type="button">BUKA APLIKASI</button>
        <p class="help"><b>Nota:</b> Sambungan sistem telah ditetapkan oleh pentadbir. Pengguna tidak perlu memasukkan URL Google Apps Script.</p>
      </div>
    </div>
    <iframe id="appFrame" title="Tempahan Majlis Ijazah Silat Cekak Hanafi" allow="clipboard-read; clipboard-write"></iframe>
  </main>
</div>
<script>
(function(){
  const APP_URL='https://script.google.com/macros/s/AKfycbynkJ3HiGgcimpxa0klmeTpcwJd4doMnrWxlcBHxQTj6lhNqYaPiwUQpl-YmCPS11ucVg/exec';
  const frame=document.getElementById('appFrame');
  const setup=document.getElementById('setup');
  const save=document.getElementById('saveBtn');
  const settings=document.getElementById('settingsBtn');
  const open=document.getElementById('openBtn');
  function load(){
    frame.src=APP_URL;
    localStorage.setItem('sch_tempahan_app_url_v45',APP_URL);
    setup.classList.add('hidden');
  }
  save.addEventListener('click',load);
  settings.addEventListener('click',()=>{
    if(confirm('Tetapan URL aplikasi dikunci untuk penggunaan rasmi SCH. Buka aplikasi sekarang?')) load();
  });
  open.addEventListener('click',()=>window.open(APP_URL,'_blank','noopener'));
  load();
  if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
